<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗑️ מחיקת אורח | WedManage</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/delete_guest.css">
<link rel="stylesheet" href="css/delete_guest.css">
</head>

<body>

    <div class="background-decorations">
        <i class="fas fa-gem decoration-item floating-diamond"></i>
        <div class="constructed-ring">
            <div class="ring-band"></div>
            <i class="fas fa-gem ring-stone"></i>
        </div>
    </div>

    <header class="header">
        <a href="homePage.html" class="logo">WedManage<span class="dot">.</span></a>
        
        <button class="back-btn" onclick="window.location.href='homePage.html'">
            <i class="fas fa-arrow-right"></i> חזרה
        </button>
    </header>

    <div class="main-content">
        <div class="card">
            <h1>מחיקת אורח</h1>
            <p class="subtitle">הכנס את שם המלא והמייל של האורח שתרצה למחוק מהרשימה.</p>

            <form id="deleteForm" onsubmit="handleDelete(event)">
                
                <div class="form-group">
                    <label for="fullName">שם מלא *</label>
                    <input id="fullName" name="fullName" type="text" placeholder="למשל: דוד כהן" required />
                </div>

                <div class="form-group">
                    <label for="email">אימייל *</label>
                    <input id="email" name="email" type="email" placeholder="example@mail.com" required />
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-user-times"></i>&nbsp; מחק אורח
                    </button>
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('deleteForm').reset();">
                        נקה
                    </button>
                </div>

                <div class="warning-text">
                    * פעולה זו תמחק את האורח ממסד הנתונים.
                </div>
            </form>
        </div>
    </div>

<script>
async function handleDelete(e) {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!fullName || !email) {
        alert('נא להזין שם מלא ואימייל.');
        return;
    }

    try {
        const response = await fetch('/api/guests/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email })
        });

        const data = await response.json();

        if (data.success) {
            alert(`האורח "${fullName}" נמחק בהצלחה!`);
            document.getElementById('deleteForm').reset();
        } else {
            alert(`שגיאה: ${data.message}`);
        }
    } catch (err) {
        console.error(err);
        alert('שגיאה בשרת.');
    }
}
</script>
</body>
</html>
