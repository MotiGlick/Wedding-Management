<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 רשימת מוזמנים | WedManage</title>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="css/sidebar.css">
   <link rel="stylesheet" href="css/all_guests.css">
</head>
<body class="page-wrapper hide-guests">

<div class="hero-decorations">
    <i class="fas fa-gem decoration-item floating-diamond"></i>
    <div class="constructed-ring">
        <div class="ring-band"></div>
        <i class="fas fa-gem ring-stone"></i>
    </div>
</div>

<button id="hamburger-btn" class="hamburger-menu">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</button>

<aside id="task-sidebar" class="sidebar"></aside>
<header class="header">
    <a href="index.html" class="logo">WedManage<span class="dot">.</span></a>
   
</header>

<div class="main-content">
    <h2>רשימת מוזמנים</h2>

    <div class="controls-container">
        <div class="control-group">
            <label><i class="fas fa-filter"></i> סינון לפי צד:</label>
            <select id="filterSelect" onchange="applyFilter()">
                <option value="">הצג הכל</option>
                <option value="חתן">צד החתן</option>
                <option value="כלה">צד הכלה</option>
            </select>
        </div>

        <div class="control-group">
            <label><i class="fas fa-sort"></i> מיון:</label>
            <select id="sortSelect" onchange="applySort()">
                <option value="">ללא מיון</option>
                <option value="alphabet">א-ב (שם פרטי)</option>
                <option value="date">תאריך הוספה (חדש לישן)</option>
            </select>
        </div>
        
        <a href="Add_guest.html" class="btn btn-outline-gold control-btn">
            <i class="fas fa-plus"></i> הוסף אורח
        </a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>שם פרטי</th>
                    <th>שם משפחה</th>
                    <th>צד</th>
                    <th>תאריך הוספה</th>
                </tr>
            </thead>
            <tbody id="guestTableBody">
                </tbody>
        </table>
    </div>
    
    <p id="noDataMessage" style="display:none; text-align:center; margin-top:20px; color:#999;">לא נמצאו אורחים.</p>
</div>
<script src="js/utils.js"></script> <script src="js/sidebar.js"></script>
<script>
    let guests = [];
    let filteredGuests = [];

    async function fetchGuests() {
        try {
            // שימוש ב-getAuthHeaders() במקום לכתוב הכל ידנית
            const response = await fetch('/api/guests', { 
                headers: getAuthHeaders() // <--- הנה הקסם
            }); 
            
            if (response.status === 401 || response.status === 403) {
                window.location.href = 'login.html';
                return;
            }

            if (!response.ok) throw new Error('שגיאה בשליפת האורחים');
            
            guests = await response.json();
            
            // מניעת קריסה אם חסר צד
            guests = guests.map(g => ({ ...g, side: g.side || '' }));

            filteredGuests = [...guests];
            renderTable(filteredGuests);
        } catch (err) {
            console.error(err);
            document.getElementById('noDataMessage').style.display = 'block';
            document.getElementById('noDataMessage').innerText = 'שגיאה בטעינת הנתונים';
        }
    }

    // שאר הפונקציות (renderTable, applySort, applyFilter) נשארות אותו דבר...
    function renderTable(data) {
        const tbody = document.getElementById('guestTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            document.getElementById('noDataMessage').style.display = 'block';
            return;
        }
        document.getElementById('noDataMessage').style.display = 'none';

        data.forEach(guest => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${guest.firstName}</td>
                <td>${guest.lastName}</td>
                <td>${guest.side}</td>
                <td>${guest.createdAt ? new Date(guest.createdAt).toLocaleString('he-IL') : ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function applySort() {
        const sortValue = document.getElementById('sortSelect').value;
        if (sortValue === 'alphabet') filteredGuests.sort((a, b) => a.firstName.localeCompare(b.firstName));
        else if (sortValue === 'date') filteredGuests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderTable(filteredGuests);
    }

    function applyFilter() {
        const filterValue = document.getElementById('filterSelect').value;
        filteredGuests = filterValue ? guests.filter(g => g.side === filterValue) : [...guests];
        applySort();
    }

    fetchGuests();
</script>
</body>
</html>
