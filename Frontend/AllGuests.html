<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 רשימת מוזמנים | WedManage</title>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root { --primary-color: #0A1121; --secondary-color: #16243D; --accent-color: #B8860B; --accent-light: #5c5f4d; --text-color: #EAECEF; --text-light: #A3B1C6; --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); --hover-card: #1D3150; --border-radius: 12px; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Heebo', sans-serif; background: var(--primary-color); color: var(--text-color); direction: rtl; }
        .header { width: 100%; padding: 25px 50px; background: var(--secondary-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); }
        .logo { font-size: 30px; font-weight: 800; color: var(--accent-light); text-decoration: none; }
        .back-btn { padding: 12px 22px; border-radius: var(--border-radius); font-weight: 700; cursor: pointer; font-size: 16px; border: none; background: var(--accent-color); color: var(--primary-color); transition: 0.3s; }
        .back-btn:hover { background: var(--accent-light); }
        .main-content { flex-grow: 1; padding: 100px 40px 40px 40px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        h2 { font-size: 32px; font-weight: 700; color: var(--accent-color); margin-bottom: 40px; text-align: center; border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; }
        .controls { display: flex; justify-content: flex-end; gap: 15px; width: 100%; max-width: 1200px; margin-bottom: 20px; }
        .controls select, .controls button { padding: 6px 12px; border-radius: var(--border-radius); border: none; font-size: 14px; cursor: pointer; background: var(--secondary-color); color: var(--text-color); transition: 0.3s; }
        .controls select:hover, .controls button:hover { background: var(--hover-card); }
        table { width: 100%; max-width: 1200px; border-collapse: collapse; margin-top: 20px; background: var(--secondary-color); border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--card-shadow); }
        th, td { padding: 12px 15px; text-align: center; }
        th { background: var(--accent-color); color: var(--primary-color); font-weight: 600; }
        tr:nth-child(even) { background: #1E2A48; }
        tr:hover { background: var(--hover-card); }
        @media (max-width: 768px) { .main-content { padding: 60px 20px 40px 20px; } h2 { font-size: 26px; margin-bottom: 30px; } }
    </style>
</head>
<body>

<header class="header">
    <a href="#" class="logo">WedManage</a>
    <button class="back-btn" onclick="location.href='homePage.html'">חזרה</button>
</header>

<div class="main-content">
    <h2>💎 רשימת מוזמנים</h2>

    <div class="controls">
        <label>סינון:</label>
        <select id="filterSelect" onchange="applyFilter()">
            <option value="">הכל</option>
            <option value="groom">חתן</option>
            <option value="bride">כלה</option>
        </select>

        <label>מיון:</label>
        <select id="sortSelect" onchange="applySort()">
            <option value="">בחר</option>
            <option value="alphabet">א-ב לפי שם פרטי</option>
            <option value="date">תאריך הרשמה אחרון</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>שם פרטי</th>
                <th>שם משפחה</th>
                <th>צד</th>
                <th>תאריך הרשמה</th>
            </tr>
        </thead>
        <tbody id="guestTableBody"></tbody>
    </table>
</div>

<script>
    let guests = [];
    let filteredGuests = [];

    async function fetchGuests() {
        try {
            // שליפת כל האורחים מה-API
            const response = await fetch('http://localhost:3000/api/guests'); 
            if (!response.ok) throw new Error('שגיאה בשליפת האורחים');
            guests = await response.json();
            
            // במקרה ואין צד מוגדר, נשמור ריק
            guests = guests.map(g => ({
                ...g,
                side: g.side || ''
            }));

            filteredGuests = [...guests];
            renderTable(filteredGuests);
        } catch (err) {
            console.error(err);
            alert('שגיאה בשליפת האורחים: ' + err.message);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('guestTableBody');
        tbody.innerHTML = '';
        data.forEach(guest => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${guest.firstName}</td>
                <td>${guest.lastName}</td>
                <td>${guest.side}</td>
                <td>${guest.createdAt ? new Date(guest.createdAt).toLocaleString('he-IL') : ''}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function applySort() {
        const sortValue = document.getElementById('sortSelect').value;
        if (sortValue === 'alphabet') {
            filteredGuests.sort((a, b) => a.firstName.localeCompare(b.firstName));
        } else if (sortValue === 'date') {
            filteredGuests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }
        renderTable(filteredGuests);
    }

    function applyFilter() {
        const filterValue = document.getElementById('filterSelect').value;
        filteredGuests = filterValue ? guests.filter(g => g.side === filterValue) : [...guests];
        applySort();
    }

    fetchGuests();
</script>
</body>
</html>
