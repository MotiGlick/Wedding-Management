<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Invitation | WedManage</title>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary-color: #0A1121;
            --secondary-color: #16243D;
            --accent-color: #B8860B;
            --accent-light: #5c5f4d;
            --text-color: #EAECEF;
            --text-light: #A3B1C6;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            --hover-card: #1D3150;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Heebo', sans-serif;
            background: var(--primary-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
            direction: rtl;
        }

        .header {
            width: 100%;
            padding: 25px 50px;
            background: var(--secondary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .logo { font-size: 30px; font-weight: 800; color: var(--accent-light); text-decoration: none; }

        .logout-btn, .back-btn {
            padding: 12px 22px;
            border-radius: var(--border-radius);
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            border: none;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        .logout-btn:hover { background: var(--accent-color); color: var(--primary-color); }

        .back-btn {
            background: var(--accent-color);
            color: var(--primary-color);
        }

        .back-btn:hover { background: var(--accent-light); }

        .main-content {
            flex-grow: 1;
            padding: 60px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #101E35 100%);
            border-radius: var(--border-radius);
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
            max-width: 600px;
            width: 100%;
            margin-bottom: 40px;
            transition: all 0.4s ease-in-out;
            border-top: 3px solid var(--accent-color);
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 30px;
            color: var(--accent-color);
        }

        /* Drag & Drop Box */
        .upload-box {
            border: 2px dashed var(--accent-color);
            border-radius: var(--border-radius);
            padding: 50px 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-box.dragover { background: rgba(255,255,255,0.15); }

        .upload-box i {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .upload-box p { margin: 0; font-size: 16px; text-align: center; }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--border-radius);
            margin-top: 15px;
            border: 2px solid var(--accent-color);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: var(--border-radius);
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .save-btn { background: var(--accent-color); color: var(--primary-color); }
        .save-btn:hover { background: var(--accent-light); }

        .send-btn { background: #4CAF50; color: var(--primary-color); }
        .send-btn:hover { background: #43a047; }

    </style>
</head>

<body>
    <header class="header">
        <a href="#" class="logo">WedManage</a>
        <div>
            <button class="back-btn" onclick="location.href='homePage.html'">חזרה</button>
            <button class="logout-btn" onclick="alert('יציאה מהמערכת');">התנתקות</button>
        </div>
    </header>

    <div class="main-content">

        <div class="card">
            <h2>העלאת הזמנה</h2>

            <label class="upload-box" id="uploadBox">
                <i class="fas fa-upload"></i>
                <p>גרור לכאן את ההזמנה או לחץ לבחירה</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </label>

            <img id="preview" class="preview-img" style="display:none;">

            <div class="button-group">
                <button class="action-btn save-btn" id="saveBtn">שמור הזמנה</button>
                <button class="action-btn send-btn" id="sendBtn">שלח הזמנה</button>
            </div>
        </div>

    </div>

    <script>
        const uploadBox = document.getElementById("uploadBox");
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        let currentFile = null;

        // Click to open file picker
        uploadBox.addEventListener("click", () => fileInput.click());

        // File selected
        fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

        // Drag & Drop
        uploadBox.addEventListener("dragover", (e) => { e.preventDefault(); uploadBox.classList.add("dragover"); });
        uploadBox.addEventListener("dragleave", () => uploadBox.classList.remove("dragover"));
        uploadBox.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadBox.classList.remove("dragover");
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith("image/")) { alert("נא להעלות קובץ תמונה בלבד"); return; }
            currentFile = file;
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }

        document.getElementById("saveBtn").addEventListener("click", () => {
            if (!currentFile) { alert("לא נבחרה תמונה"); return; }
            alert("הזמנה נשמרה (פיקטיבי כרגע)");
        });

        document.getElementById("sendBtn").addEventListener("click", () => {
            if (!currentFile) { alert("לא נבחרה תמונה לשליחה"); return; }
            alert("מעבר לדף שליחת ההזמנות");
        });
    </script>

</body>
</html>
