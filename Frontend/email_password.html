<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איפוס סיסמה - שלב 2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .reset-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 45px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: right;
      transition: all 0.3s ease;
    }

    .reset-card:hover {
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 35px;
      font-size: 24px;
      font-weight: 600;
    }

    .input-container {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 15px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      color: green;
      margin-top: 15px;
      font-size: 14px;
    }

    .error-message {
      display: block;
      color: #e74c3c;
      font-size: 13px;
      margin-top: 5px;
      height: 15px;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password-btn {
      position: absolute;
      left: 5px; 
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      font-size: 18px;
      color: #777;
      transition: color 0.2s;
    }

    .toggle-password-btn:hover {
      color: #007bff;
    }

  </style>
</head>
<body>

  <form class="reset-card" id="resetForm2">
    <h2>איפוס סיסמה</h2>


    <div class="input-container">
      <label for="code">הכנס קוד (סיסמה זמנית):</label>
      <input type="text" id="code" name="code" required placeholder="הקוד מהמייל">
      <span class="error-message" id="codeError"></span>
    </div>

    <div class="input-container">
      <label for="newPassword">סיסמה חדשה:</label>
      <div class="password-wrapper">
        <input type="password" id="newPassword" name="newPassword" required placeholder="••••••••">
        <button type="button" class="toggle-password-btn" id="toggleNewPassword">
          <i class="fas fa-eye-slash"></i>
        </button>
      </div>
      <span class="error-message" id="passwordError"></span>
    </div>

    <button type="submit">אפס סיסמה</button>
    <div class="message" id="successMessage"></div>
  </form>

  <script>
    const form = document.getElementById('resetForm2');
    const codeInput = document.getElementById('code');
    const newPasswordInput = document.getElementById('newPassword');
    const successMessage = document.getElementById('successMessage');

    // משיכת האימייל ישירות משורת הכתובת
    const params = new URLSearchParams(window.location.search);
    const userEmail = params.get('email'); 

    // הצגת/הסתרת סיסמה
    const toggleBtn = document.getElementById('toggleNewPassword');
    toggleBtn.addEventListener('click', () => {
      const type = newPasswordInput.type === 'password' ? 'text' : 'password';
      newPasswordInput.type = type;
      toggleBtn.innerHTML = type === 'password' ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!userEmail) {
        successMessage.style.color = 'red';
        successMessage.textContent = 'שגיאה: אימייל חסר. אנא היכנס דרך הקישור שבמייל.';
        return;
      }

      successMessage.textContent = '';
      document.querySelectorAll('.error-message').forEach(el => el.textContent = '');

      const payload = {
        email: userEmail,
        tempPassword: codeInput.value.trim(), 
        newPassword: newPasswordInput.value.trim() 
      };

      try {
        const response = await fetch('/api/auth/resetpassword', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          successMessage.style.color = 'green';
          successMessage.textContent = 'הסיסמה עודכנה בהצלחה! מועבר להתחברות...';
          setTimeout(() => window.location.href = 'login.html', 2500);
        } else {
          successMessage.style.color = 'red';
          successMessage.textContent = data.message || 'אירעה שגיאה בעיבוד הבקשה.';
        }
      } catch (err) {
        successMessage.style.color = 'red';
        successMessage.textContent = 'שגיאת תקשורת עם השרת.';
      }
    });
  </script>

</body>
</html>
