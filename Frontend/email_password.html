<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איפוס סיסמה</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .reset-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 45px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: right;
      transition: all 0.3s ease;
    }

    .reset-card:hover {
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 35px;
      font-size: 24px;
      font-weight: 600;
    }

    .input-container {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 15px;
    }

    input[type="email"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
    }

    .error-message {
      display: block;
      color: #e74c3c;
      font-size: 13px;
      margin-top: 5px;
      height: 15px;
    }

    .message {
      text-align: center;
      color: green;
      margin-top: 15px;
      font-size: 14px;
    }

    /* --- כפתור מעוצב --- */
    .reset-link {
      display: block;
      text-decoration: none;
    }

    .reset-button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    .reset-button:hover {
      background-color: #0056b3;
    }

    .reset-button:active {
      transform: scale(0.98);
    }

  </style>
</head>
<body>

  <form class="reset-card" id="resetForm">
    <h2>איפוס סיסמה</h2>

    <div class="input-container">
      <label for="email">הכנס את המייל שלך:</label>
      <input type="email" id="email" name="email" required placeholder="example@domain.com">
      <span class="error-message" id="emailError"></span>
    </div>

    <a href="new_password.html" class="reset-link">
      <button type="button" class="reset-button">שלח מייל לאיפוס סיסמה</button>
    </a>

    <div class="message" id="successMessage"></div>

  </form>

  <script>
    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      emailError.textContent = '';
      successMessage.textContent = '';

      if (!email) {
        emailError.textContent = 'אנא הכנס כתובת מייל תקינה.';
        return;
      }

      // כאן נשלח בקשה לשרת כדי לשלוח את המייל
      // לדוגמה באמצעות fetch
      fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          successMessage.textContent = 'המייל נשלח בהצלחה! בדוק את התיבה שלך.';
        } else {
          emailError.textContent = data.message || 'אירעה שגיאה. נסה שוב.';
        }
      })
      .catch(err => {
        emailError.textContent = 'אירעה שגיאה בשרת.';
      });
    });
  </script>

</body>
</html>
