<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שכחתי סיסמה</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* שמירת העיצוב הקיים */
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .reset-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 45px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: right;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
    }

    .input-container {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 15px;
    }

    input[type="email"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <form class="reset-card" id="resetForm">
    <h2>שכחתי סיסמה</h2>
    <p style="text-align:center; color:#777; margin-bottom: 30px; font-size:15px;">
        הזן את כתובת האימייל שלך. אנו נשלח קישור לאיפוס הסיסמה.
    </p>

    <div class="input-container">
      <label for="email">כתובת אימייל:</label>
      <input type="email" id="email" name="email" required placeholder="example@domain.com">
    </div>

    <button type="submit">שלח לי קישור לאיפוס</button>
    <div class="message" id="messageDisplay"></div>
    <div style="text-align:center; margin-top:15px;">
        <a href="login.html" style="color: #007bff; text-decoration: none; font-size: 14px;">חזור להתחברות</a>
    </div>

  </form>

  <script>
    const API_FORGOT_URL = 'http://localhost:3000/api/auth/forgotpassword'; 
    
    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('email'); 
    const messageDisplay = document.getElementById('messageDisplay'); 
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      
      messageDisplay.className = 'message';
      messageDisplay.textContent = '...שולח בקשה...';
      messageDisplay.style.color = '#007bff';

      if (!email || !email.includes('@')) {
        messageDisplay.textContent = 'אנא הכנס כתובת אימייל תקינה.';
        messageDisplay.style.color = 'red';
        return;
      }

      try {
        const response = await fetch(API_FORGOT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const result = await response.json();

        // ה-Backend מחזיר 200 גם אם המשתמש לא קיים (מטעמי אבטחה)
        if (response.status === 200 || response.ok) {
          messageDisplay.textContent = '✅ אם האימייל קיים במערכת, נשלח אליך קישור לאיפוס סיסמה.';
          messageDisplay.style.color = 'green';
          // מנקים את שדה הקלט
          emailInput.value = ''; 
        } else {
          // שגיאה פנימית בשרת
          messageDisplay.textContent = `❌ שגיאה: ${result.message || 'שגיאה פנימית'}`;
          messageDisplay.style.color = 'red';
        }
      } catch (err) {
        console.error("שגיאת רשת:", err);
        messageDisplay.textContent = '❌ שגיאת רשת. אנא בדוק את החיבור שלך.';
        messageDisplay.style.color = 'red';
      }
    });
  </script>

</body>
</html>
