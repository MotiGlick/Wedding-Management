<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איפוס סיסמה</title>

    <!-- CSP מותאם לפיתוח -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">

    <!-- FontAwesome מקומי -->
    <link rel="stylesheet" href="css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .reset-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px 45px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: right;
        }

        h2 { text-align: center; color: #2c3e50; margin-bottom: 35px; font-size: 24px; font-weight: 600; }

        .input-container { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; color: #555; font-size: 15px; }

        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button[type="submit"]:hover { background-color: #0056b3; }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .status-success { background-color: #e6f7e9; color: #2ecc71; border: 1px solid #2ecc71; }
        .status-error { background-color: #fce7e7; color: #e74c3c; border: 1px solid #e74c3c; }

        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 16px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #007bff; }
    </style>
</head>
<body>

    <form class="reset-card" id="resetForm">
        <h2>איפוס סיסמה</h2>
        <div id="loadingStatus">...טוען...</div>

        <div id="formContent" style="display: none;">
            <p class="mb-4 text-center text-gray-600">הזן סיסמה חדשה לחשבון שלך.</p>

            <div class="input-container">
                <label for="password">סיסמה חדשה:</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="מינימום 6 תווים">
                    <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <div class="input-container">
                <label for="confirmPassword">אישור סיסמה:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="הזן שוב את הסיסמה החדשה">
            </div>

            <div id="validationMessage" class="status-message status-error" style="display: none;"></div>
            <button type="submit" id="resetButton">אפס סיסמה</button>
        </div>

        <div id="loginLinkContainer" class="links-container mt-4 text-center" style="display: none;">
             <a href="login.html">חזור לדף ההתחברות</a>
        </div>
    </form>

    <script>
        const API_BASE_URL = '/api/auth/resetpassword/'; 
        const MIN_PASSWORD_LENGTH = 6;

        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const validationMessage = document.getElementById('validationMessage');
        const loadingStatus = document.getElementById('loadingStatus');
        const formContent = document.getElementById('formContent');
        const loginLinkContainer = document.getElementById('loginLinkContainer');

        function displayMessage(message, isError) {
            validationMessage.textContent = message;
            validationMessage.className = isError ? 'status-message status-error' : 'status-message status-success';
            validationMessage.style.display = 'block';
            loadingStatus.style.display = 'none';
        }

        function getUrlToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = getUrlToken();
            if (!token) {
                displayMessage('❌ שגיאה: לא נמצא טוקן איפוס בכתובת.', true);
                loginLinkContainer.style.display = 'block';
            } else {
                loadingStatus.style.display = 'none';
                formContent.style.display = 'block';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = getUrlToken();
            const newPassword = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword.length < MIN_PASSWORD_LENGTH) {
                return displayMessage(`הסיסמה חייבת להיות באורך של ${MIN_PASSWORD_LENGTH} תווים לפחות.`, true);
            }
            if (newPassword !== confirmPassword) {
                return displayMessage('הסיסמה החדשה ואישור הסיסמה אינם תואמים.', true);
            }
            if (!token) return displayMessage('שגיאה פנימית: טוקן איפוס חסר.', true);

            validationMessage.style.display = 'none';
            loadingStatus.textContent = '...מאפס סיסמה...';
            loadingStatus.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE_URL}${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword })
                });

                const result = await response.json();

                if (response.ok) {
                    displayMessage('✅ הסיסמה עודכנה בהצלחה! ניתן להתחבר.', false);
                    formContent.style.display = 'none';
                    loginLinkContainer.style.display = 'block';
                } else {
                    displayMessage(`❌ שגיאה: ${result.message || response.statusText}`, true);
                }
            } catch (error) {
                console.error("שגיאת רשת:", error);
                displayMessage('❌ שגיאת רשת: לא ניתן להתחבר לשרת.', true);
            }

            loadingStatus.style.display = 'none';
        });

        const toggleButton = document.getElementById('togglePassword');
        if (toggleButton) {
            toggleButton.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }
    </script>

</body>
</html>
