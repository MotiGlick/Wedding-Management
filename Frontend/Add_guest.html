<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 הוספת אורח | WedManage</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --primary-color: #0A1121; --secondary-color: #16243D; --accent-color: #B8860B; --accent-light: #5c5f4d; --text-color: #EAECEF; --text-light: #A3B1C6; --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); --hover-card: #1D3150; --border-radius: 12px; --input-bg: rgba(255,255,255,0.03); }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Heebo', sans-serif; background: linear-gradient(180deg, var(--primary-color) 0%, #07101A 100%); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        .header { width: 100%; padding: 20px 40px; background: var(--secondary-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); }
        .logo { font-size: 26px; font-weight: 800; color: var(--accent-light); letter-spacing: 2px; text-decoration: none; }
        .main { width: 100%; max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 420px; gap: 30px; align-items: start; }
        .form-card { background: linear-gradient(135deg, var(--secondary-color) 0%, #0E2034 100%); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--card-shadow); border-top: 3px solid var(--accent-color); }
        .form-card h1 { margin: 0 0 8px 0; font-size: 26px; color: var(--accent-light); }
        .form-card p { margin: 0 0 18px 0; color: var(--text-light); font-weight: 300; }
        form { display: grid; gap: 14px; }
        .row { display: flex; gap: 14px; }
        .row .col { flex: 1; }
        label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea { width: 100%; padding: 12px 14px; background: var(--input-bg); color: var(--text-color); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; outline: none; font-size: 15px; }
        input:focus, select:focus, textarea:focus { box-shadow: 0 6px 18px rgba(0,0,0,0.7); transform: translateY(-2px); }
        .small { font-size: 13px; color: var(--text-light); }
        .actions { display:flex; gap:12px; margin-top: 6px; }
        .btn { padding: 12px 18px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent-color); color: var(--primary-color); border-color: rgba(0,0,0,0.2); box-shadow: 0 8px 30px rgba(184,134,11,0.12); }
        .btn-ghost { background: transparent; color: var(--text-light); border: 1px solid rgba(255,255,255,0.06); }
        @media (max-width: 980px) { .main { grid-template-columns: 1fr; } }
        @media (max-width: 480px) { .header { padding: 16px; } .logo { font-size: 20px; } }
    </style>
</head>
<body>

<header class="header">
    <a class="logo" href="index.html">WedManage</a>
    <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-ghost" onclick="history.back();"><i class="fas fa-arrow-right"></i>&nbsp; חזור</button>
        <button class="btn btn-ghost" onclick="alert('ביישום אמיתי: שמירת טיוטה');"><i class="fas fa-save"></i>&nbsp; שמור טיוטה</button>
    </div>
</header>

<main class="main">
    <section class="form-card" aria-labelledby="guest-form-title">
        <h1 id="guest-form-title">הוספת אורח חדש</h1>
        <p>מלא את פרטי האורח כדי להוסיף אותו לרשימת המוזמנים. השדות המסומנים הם חובה.</p>

        <form id="guestForm" onsubmit="handleSubmit(event)">
            <div class="row">
                <div class="col">
                    <label for="firstName">שם פרטי *</label>
                    <input id="firstName" name="firstName" type="text" placeholder="שם פרטי" required maxlength="60" />
                </div>
                <div class="col">
                    <label for="lastName">שם משפחה *</label>
                    <input id="lastName" name="lastName" type="text" placeholder="שם משפחה" required maxlength="60" />
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="email">אימייל</label>
                    <input id="email" name="email" type="email" placeholder="email@example.com" />
                </div>
                <div class="col">
                    <label for="phone">טלפון</label>
                    <input id="phone" name="phone" type="tel" placeholder="050-1234567" />
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="rsvp">סטטוס אישור הגעה *</label>
                    <select id="rsvp" name="rsvp" required>
                        <option value="">בחר סטטוס</option>
                        <option value="yes">מגיע/ה</option>
                        <option value="no">לא מגיע/ה</option>
                        <option value="maybe">אולי</option>
                    </select>
                </div>

                <div class="col">
                    <label for="side">צד (חתן/כלה)</label>
                    <select id="side" name="side">
                        <option value="">בחר צד (אופציונלי)</option>
                        <option value="חתן">צד החתן</option>
                        <option value="כלה">צד הכלה</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="plusOne">מלווה (Plus-one)</label>
                    <input id="plusOne" name="plusOne" type="text" placeholder="שם המלווה (אם יש)" />
                </div>
                <div class="col">
                     <label for="diet">מידע תזונתי / אלרגיות</label>
                     <input id="diet" name="diet" type="text" placeholder="למשל: טבעוני, ללא גלוטן" />
                </div>
            </div>

            <div>
                <label for="notes">הערות נוספות</label>
                <textarea id="notes" name="notes" rows="4" placeholder="הערות מיוחדות או בקשות" style="resize:vertical;"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">
                     <i class="fas fa-user-check"></i>&nbsp; הוסף אורח
               </button>
                 <button type="button" class="btn btn-ghost" onclick="document.getElementById('guestForm').reset();">
                   נקה טופס
                 </button>
                 <a href="delete_guest.html" class="btn btn-ghost">
                   <i class="fas fa-user-minus"></i>&nbsp; מחק אורח
                 </a>
                 <a href="AllGuests.html" class="btn btn-ghost">
                   <i class="fas fa-users"></i>&nbsp; הצגת כל האורחים
                 </a>
            </div>

            <p class="small">* שמות ישמרו כפי שהוזנו.</p>
        </form>
    </section>
</main>

<script>
async function handleSubmit(e) {
    e.preventDefault();
    const form = document.getElementById('guestForm');
    
    // אוסף את כל השדות שיש להם name (כולל side, rsvp וכו')
    const data = Object.fromEntries(new FormData(form).entries());

    // בדיקה בסיסית
    if (!data.firstName || !data.lastName || !data.rsvp) {
        alert('נא למלא שם פרטי, שם משפחה וסטטוס אישור הגעה.');
        return;
    }

    try {
        // וודא שהכתובת כאן תואמת לפורט של השרת שלך (3000)
        const response = await fetch('http://localhost:3000/api/guests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || 'שגיאה בהוספת אורח');
        }

        const result = await response.json();
        alert(`האורח ${result.firstName} ${result.lastName} נוסף בהצלחה!`);
        form.reset();

    } catch (err) {
        console.error(err);
        alert(`שגיאה: ${err.message}`);
    }
}
</script>

</body>
</html>
