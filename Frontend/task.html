<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות חתונה</title>

    <link rel="stylesheet" href="css/task.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="page-wrapper hide-task">
  

    <button id="hamburger-btn" class="hamburger-menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <aside id="task-sidebar" class="sidebar"></aside>
    
 <header class="header">
    <a href="homePage.html" class="logo"><span class="dot">.</span>WedManage</a>
   
 </header>

   

    <div class="main-layout">
        
        <section class="calendar-container">
            <div id="calendar"></div>
        </section>

        <section class="info-panel">
            <div class="info-card next-task-card">
                <h3><i class="fas fa-hourglass-half"></i> המשימה הקרובה</h3>
                <div id="next-task">טוען...</div>
            </div>

            <div class="info-card task-list-card">
                <h3><i class="fas fa-list-ul"></i> רשימת המשימות</h3>
                <ul id="task-list-display"></ul> 
            </div>
        </section>

    </div>

    <div id="addTaskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">הוספת משימה חדשה</h3>

            <div class="input-group">
                <label>כותרת</label>
                <input type="text" id="modal-task-title" placeholder="לדוגמה: פגישה עם הצלם">
            </div>

            <div class="input-group">
                <label>תיאור</label>
                <textarea id="modal-task-description-add" rows="3"></textarea>
            </div>

            <div style="display: flex; gap: 20px;">
                <div class="input-group" style="flex: 1;">
                    <label>תאריך</label>
                    <input type="text" id="modal-task-date" readonly>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>שעה (אופציונלי)</label>
                    <input type="time" id="modal-task-time">
                </div>
            </div>

            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn btn-secondary">ביטול</button>
                
                <button id="btn-open-reminder-popup" class="btn btn-outline-gold">
                    <i class="fas fa-bell"></i> הוסף תזכורת
                </button>

                <button id="modal-save-btn" class="btn btn-primary">שמור משימה</button>
            </div>
        </div>
    </div>

    <div id="viewTaskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="view-task-title"></h3>
            <input type="hidden" id="view-task-id">
            <input type="hidden" id="view-task-date-iso">
            <input type="hidden" id="view-has-reminder"> 
            
            <p style="margin-bottom: 20px; color: var(--gold); font-size: 1.2rem; font-weight:bold;">
                <i class="far fa-calendar-alt"></i> <span id="view-task-date"></span>
            </p>

            <div class="input-group">
                <label>תיאור המשימה</label>
                <textarea id="view-task-description" rows="3"></textarea>
            </div>

            <div class="modal-actions">
                <button id="modal-delete-btn" class="btn btn-danger">מחיקה</button>
                
                <button id="btn-view-reminder-popup" class="btn btn-outline-gold">
                    <i class="fas fa-bell"></i> נהל תזכורת
                </button>

                <button id="modal-close-view-btn" class="btn btn-secondary">סגור</button>
                <button id="modal-save-description-btn" class="btn btn-primary">עדכן פרטים</button>
            </div>
        </div>
    </div>

    <div id="reminderFloatingPopup" class="floating-popup-overlay">
        <div class="floating-popup-content">
            <div class="popup-header">
                <h3>
                    <i class="fas fa-clock"></i> מועד התזכורת
                    <span class="info-tooltip" title="התזכורת תישלח לכתובת המייל המוגדרת בחשבונך">
                        <i class="fas fa-info-circle"></i>
                    </span>
                </h3>
            </div>
            
            <div id="existing-reminder-alert" style="display:none; background:#e8f5e9; color:#2e7d32; padding:10px; border-radius:8px; margin-bottom:15px; font-size:0.9rem;">
                <i class="fas fa-check-circle"></i> למשימה זו מוגדרת תזכורת פעילה.
            </div>

            <div class="input-group">
                <label>מתי לשלוח?</label>
                <select id="popup-reminder-schedule" onchange="toggleTimeInputsLocal(this.value)" class="styled-select">
                    <option value="">-- בחר מועד --</option>
                    <option value="custom_relative">פרק זמן לפני המשימה</option>
                    <option value="custom_absolute">תאריך ושעה מדויקים</option>
                </select>
            </div>

            <div id="popup-relative-container" class="hidden-section flex-row">
                <input type="number" id="popup-relative-amount" min="1" value="1" class="small-input">
                <select id="popup-relative-unit" class="small-select">
                    <option value="minutes">דקות</option>
                    <option value="hours">שעות</option>
                    <option value="days">ימים</option>
                </select>
                <span class="text-label">לפני המשימה</span>
            </div>

            <div id="popup-absolute-container" class="hidden-section">
                <input type="datetime-local" id="popup-absolute-time">
            </div>

            <div class="popup-actions" style="margin-top: 25px; display: flex; justify-content: space-between; gap: 10px;">
                <button id="btn-delete-reminder" class="btn btn-danger-small" style="display:none;">
                    <i class="fas fa-trash-alt"></i> בטל תזכורת
                </button>
                
                <div style="margin-right: auto; display: flex; gap: 10px;">
                    <button id="btn-cancel-popup" class="btn btn-secondary-small">ביטול</button>
                    <button id="btn-confirm-popup" class="btn btn-primary-small">שמור</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/task.js"></script>
</body>
</html>
