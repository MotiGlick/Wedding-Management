<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות חתונה</title>

    <link rel="stylesheet" href="css/task.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="page-wrapper">

    <button id="hamburger-btn" class="hamburger-menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <aside id="task-sidebar" class="sidebar">
        
        <h2 class="sidebar-title">ניווט מהיר</h2>
        
        <div class="top-info">
            <h2>המשימה הקרובה</h2>
            <div id="next-task"></div>
        </div>

        <div class="tasks-list">
            <h3>רשימת המשימות</h3>
            <ul id="task-list-sidebar"></ul> 
        </div>
        
        <div class="reminder-card">
            <h3><i class="fas fa-bell"></i> שליחת תזכורות</h3>
            
            <div class="input-group" style="margin-bottom: 15px;">
                <label style="color: var(--gold);">בחר משימה לתזכורת:</label>
                <select id="reminder-task-select" style="width: 100%; padding: 8px; border-radius: 8px; background: var(--bg-main); border: 1px solid #2b3750; color: var(--text-main); margin-top: 5px;">
                    <option value="">בחר משימה...</option>
                </select>
            </div>
    
            <div class="input-group">
                <label style="color: var(--gold);">אמצעי תזכורת:</label>
                <div id="reminder-method-options" style="display: flex; gap: 15px; margin-top: 5px; margin-bottom: 15px;">
                    <label><input type="radio" name="reminder-type" value="email" checked> אימייל</label>
                    <label><input type="radio" name="reminder-type" value="phone"> SMS</label>
                </div>
            </div>

            <div class="input-group">
                <label style="color: var(--gold);">מתי לשלוח:</label>
                <select id="reminder-schedule-select" onchange="toggleReminderInputs(this.value)" style="width: 100%; padding: 8px; border-radius: 8px; background: var(--bg-main); border: 1px solid #2b3750; color: var(--text-main); margin-top: 5px;">
                    <option value="">בחר מועד...</option>
                    <option value="custom_relative">זמן לפני המשימה</option>
                    <option value="custom_absolute">תאריך ושעה מדויקים</option>
                </select>

                <div id="reminder-time-options" style="margin-top: 10px;">
                    <div id="custom-relative-container" style="display: none; align-items: center; gap: 10px;">
                        <input type="number" id="relative-amount-input" min="1" value="1" style="width: 50px; padding: 8px; border-radius: 8px; border: 1px solid #2b3750; text-align: center;">
                        <select id="relative-unit-select" style="padding: 8px; border-radius: 8px; border: 1px solid #2b3750; background: var(--bg-main); color: var(--text-main);">
                            <option value="minutes">דקות</option>
                            <option value="hours">שעות</option>
                            <option value="days">ימים</option>
                        </select>
                        <label style="color: var(--text-sub);">לפני</label>
                    </div>

                    <div id="custom-absolute-container" style="display: none;">
                        <input type="datetime-local" id="custom-reminder-datetime" style="width: 100%; padding: 8px; border-radius: 8px; background: var(--bg-main); border: 1px solid #2b3750; color: var(--text-main);">
                    </div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <label style="color: var(--gold);">למי לשלוח:</label>
                <div id="reminder-recipient-options" style="display: flex; gap: 15px; margin-top: 5px; margin-bottom: 15px;">
                    <label><input type="radio" name="reminder-recipient" value="me" checked> אני</label>
                    <label><input type="radio" name="reminder-recipient" value="partner"> בן/בת הזוג</label>
                    <label><input type="radio" name="reminder-recipient" value="both"> שנינו</label>
                </div>
            </div>
            
            <button type="button" onclick="sendReminder()" class="btn-primary" style="width: 100%;">אשר תזכורת</button>
        </div>
    </aside>

    <div class="back-link-container">
        <a href="homePage.html" class="back-button back-button-style">
            <i class="fas fa-arrow-right"></i> חזרה לדף הבית
        </a>
    </div>

    <section class="calendar-container">
        <div id="calendar"></div>
    </section>

    <div id="addTaskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">הוספת משימה</h3>

            <div class="input-group">
                <label>כותרת</label>
                <input type="text" id="modal-task-title">
            </div>

            <div class="input-group">
                <label>תיאור</label>
                <textarea id="modal-task-description-add" rows="3"></textarea>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1;">
                    <label>תאריך</label>
                    <input type="text" id="modal-task-date" readonly>
                </div>
                
                <div class="input-group" style="flex: 1;">
                    <label>שעה (אופציונלי)</label>
                    <input type="time" id="modal-task-time">
                </div>
            </div>

            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn btn-secondary">ביטול</button>
                <button id="modal-save-btn" class="btn btn-primary">שמור</button>
            </div>
        </div>
    </div>

    <div id="viewTaskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="view-task-title"></h3>
            <input type="hidden" id="view-task-id">
            <p><strong>זמן:</strong> <span id="view-task-date"></span></p>

            <div class="input-group">
                <label>תיאור</label>
                <textarea id="view-task-description" rows="4"></textarea>
            </div>

            <div class="modal-actions">
                <button id="modal-delete-btn" class="btn btn-danger">מחיקה</button>
                <button id="modal-close-view-btn" class="btn btn-secondary">סגור</button>
                <button id="modal-save-description-btn" class="btn btn-primary">שמור</button>
            </div>
        </div>
    </div>

    <script src="js/task.js"></script>
</body>
</html>
