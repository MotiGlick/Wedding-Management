<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 דוחות וסטטיסטיקה | WedManage</title>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
      <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/reports.css">
</head>

<body>

    <div class="background-decorations">
        <i class="fas fa-gem decoration-item floating-diamond"></i>
        <div class="constructed-ring">
            <div class="ring-band"></div>
            <i class="fas fa-gem ring-stone"></i>
        </div>
    </div>

      <button id="hamburger-btn" class="hamburger-menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <aside id="task-sidebar" class="sidebar"></aside>
    
    <header class="header">
      <a href="homePage.html" class="logo">WedManage<span class="dot">.</span></a>
   
    </header>

    <div class="main-content">
        <h1><i class="fas fa-chart-line"></i> דוחות וסטטיסטיקה</h1>
        <p class="subtitle">סקירה מקיפה של נתוני האירוע, התקציב והמוזמנים בזמן אמת.</p>

        <div class="kpi-grid">
            
            <div class="kpi-card">
                <div class="icon-circle"><i class="fas fa-wallet"></i></div>
                <div class="kpi-info">
                    <span>סה"כ הוצאות</span>
                    <span class="value">₪ 0</span>
                </div>
            </div>

            <div class="kpi-card">
                <div class="icon-circle"><i class="fas fa-check-circle"></i></div>
                <div class="kpi-info">
                    <span>אורחים שאישרו</span>
                    <span class="value">0</span>
                </div>
            </div>

            <div class="kpi-card">
                <div class="icon-circle"><i class="fas fa-tasks"></i></div>
                <div class="kpi-info">
                    <span>משימות פתוחות</span>
                    <span class="value">0</span>
                </div>
            </div>

            <div class="kpi-card">
                <div class="icon-circle"><i class="fas fa-hourglass-half"></i></div>
                <div class="kpi-info">
                    <span>ימים לאירוע</span>
                    <span class="value">-</span> 
                </div>
            </div>
        </div>

        <div class="charts-container">
            
            <div class="chart-card">
                <h3><i class="fas fa-pie-chart"></i> התפלגות הוצאות לפי קטגוריה</h3>
                
                <div class="bar-chart">
                    <p style="text-align:center; color:#999; margin-top:20px;">טוען נתונים...</p>
                </div>
            </div>

            <div class="chart-card">
    <h3><i class="fas fa-chart-pie"></i> התפלגות הוצאות לפי קטגוריה</h3>
    
            <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> התפלגות הוצאות לפי קטגוריה</h3>
            
            <div class="pie-chart-container">
                <div class="pie-chart" id="categoryPieChart">
                    <div class="pie-center-info">
                        <span>סה"כ</span>
                        <span id="pieTotalAmount">₪0</span>
                    </div>
                </div>

                <div class="pie-legend" id="categoryLegend">
                    <p style="color:#999; font-size:14px;">טוען נתונים...</p>
                </div>
            </div>
        </div>

                <div class="progress-bar-container">
                    <div class="progress-label">אחוז תפוסה מהמוזמנים:</div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 0%;">0%</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/reports.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
